name: Fork Runtime Predicate Validation
on:
  push:
    branches: [feat/runtime-predicate-pruning, feat/runtime-predicate-generation, feat/runtime-row-group-pruning, feat/runtime-row-group-selection, feat/runtime-position-delete-selection, feat/iceberg-runtime-page-pruning]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check pinned nightly formatting
        run: |
          rustup toolchain install nightly-2026-04-16 --profile minimal --component rustfmt
          cargo +nightly-2026-04-16 fmt --all -- --check
      - name: Run runtime predicate and delete tests
        run: cargo +stable test --locked -p iceberg --lib runtime_predicate -- --nocapture
      - name: Run existing Arrow reader regressions
        run: cargo +stable test --locked -p iceberg --lib arrow::reader
      - name: Check reader API and tests with clippy
        run: cargo +stable clippy --locked -p iceberg --tests
