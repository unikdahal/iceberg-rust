name: Fork Runtime Predicate Validation
on:
  push:
    branches: [feat/runtime-predicate-pruning]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run runtime predicate and delete tests
        run: cargo +stable test --locked -p iceberg --lib runtime_predicate -- --nocapture
      - name: Check reader API and tests with clippy
        run: cargo +stable clippy --locked -p iceberg --tests
