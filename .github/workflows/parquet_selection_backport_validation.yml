name: Fork Parquet Row Group Selection Backport
on:
  push:
    branches: [feat/parquet-row-group-selection-backport]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder-tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: iceberg
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/arrow-rs
          ref: 782e5a685501a9db6cc8e9a3b7cbff894940c47a # 59.2.0
          path: arrow
          submodules: true
          persist-credentials: false
      - name: Apply generic Parquet selection backport
        working-directory: arrow
        run: git apply ../iceberg/dev/backports/parquet-row-group-selection-59.patch
      - name: Install the pinned Arrow toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: arrow
        run: cargo +1.96.1 fmt --all -- --check
      - name: Test existing and backported push decoder behavior
        working-directory: arrow
        run: cargo +1.96.1 test -p parquet --features async --lib arrow::push_decoder
      - name: Test async reader and synchronous selection compatibility
        working-directory: arrow
        run: |
          cargo +1.96.1 test -p parquet --features async --lib arrow::async_reader
          cargo +1.96.1 test -p parquet --features async --lib arrow::arrow_reader
      - name: Check the Parquet reader with strict clippy
        working-directory: arrow
        run: cargo +1.96.1 clippy -p parquet --features async --lib -- -D warnings
