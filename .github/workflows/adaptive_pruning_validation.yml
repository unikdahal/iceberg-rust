name: Fork Adaptive Iceberg Pruning Validation
on:
  push:
    branches: [feat/iceberg-adaptive-pruning]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: iceberg
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly-2026-04-16 --profile minimal --component rustfmt --component clippy
      - name: Check Iceberg formatting
        working-directory: iceberg
        run: cargo +nightly-2026-04-16 fmt --all -- --check
      - name: Verify the production dependency pin
        working-directory: iceberg
        run: cargo +stable tree --locked -p iceberg -i parquet
      - name: Run live runtime and delete tests with local selections
        working-directory: iceberg
        run: |
          cargo +stable test --locked -p iceberg --features runtime-row-group-selections --lib runtime_predicate -- --nocapture
      - name: Run all Iceberg library regressions
        working-directory: iceberg
        run: cargo +stable test --locked -p iceberg --lib
      - name: Run task and manifest planning regressions
        working-directory: iceberg
        run: |
          cargo +stable test --locked -p iceberg --lib scan::
      - name: Run existing reader regressions with local selections
        working-directory: iceberg
        run: |
          cargo +stable test --locked -p iceberg --features runtime-row-group-selections --lib arrow::reader
      - name: Run inclusive metrics and lazy delete loader regressions
        working-directory: iceberg
        run: |
          cargo +stable test --locked -p iceberg --lib expr::visitors::inclusive_metrics_evaluator
          cargo +stable test --locked -p iceberg --lib arrow::delete_file_loader
      - name: Strict clippy for the selection-enabled reader
        working-directory: iceberg
        run: |
          cargo +nightly-2026-04-16 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check fallback without local selections
        working-directory: iceberg
        run: cargo +stable test --locked -p iceberg --no-default-features --lib runtime_predicate
