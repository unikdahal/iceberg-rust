# Fork-only validation of adaptive runtime pruning, with upstream check coverage.
name: Fork Adaptive Pruning Validation

on:
  push:
    branches: ['adaptive-ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-adaptive-pruning-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-adaptive-fmt

      - name: Cargo format
        run: cargo fmt --all -- --check

  clippy:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-adaptive-clippy

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - { name: "default", args: "--all-targets --all-features --workspace" }
          - { name: "doc", args: "--doc --all-features --workspace" }
    name: Tests (${{ matrix.test-suite.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-adaptive-tests-${{ matrix.test-suite.name }}

      - name: Start Docker containers
        if: matrix.test-suite.name == 'default'
        run: make docker-up

      - name: Run tests
        shell: bash
        env:
          TEST_ARGS: ${{ matrix.test-suite.args }}
          # Match upstream: HuggingFace tests self-skip if credentials are unset.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: ${{ secrets.HF_BUCKET }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          set -o pipefail
          cargo test --no-fail-fast $TEST_ARGS 2>&1 | tee test-results.log

      - name: Capture Docker logs
        if: always() && matrix.test-suite.name == 'default'
        run: docker compose -f dev/docker-compose.yaml logs --no-color > docker-services.log 2>&1

      - name: Stop Docker containers
        if: always() && matrix.test-suite.name == 'default'
        run: make docker-down

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-adaptive-pruning-tests-${{ matrix.test-suite.name }}
          path: |
            test-results.log
            docker-services.log
          retention-days: 14


  runtime-performance:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: $/.github/actions/setup-builder

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-adaptive-runtime-performance

      - name: Measure runtime pruning
        shell: bash
        run: |
          set -o pipefail
          cargo test -p iceberg --release runtime_performance_ -- --ignored --nocapture --test-threads=1 2>&1 | tee runtime-performance.log

      - name: Upload timing results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-performance
          path: runtime-performance.log
          retention-days: 14
