name: Fork Runtime Row Group Selection Validation
on:
  push:
    branches: [feat/runtime-row-group-selection, feat/runtime-position-delete-selection, feat/iceberg-runtime-page-pruning]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-tests:
    if: github.repository == 'unikdahal/iceberg-rust'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: iceberg
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/arrow-rs
          ref: 782e5a685501a9db6cc8e9a3b7cbff894940c47a # 59.2.0
          path: arrow
          persist-credentials: false
      - name: Apply validated generic Parquet selection backport
        working-directory: arrow
        run: git apply ../iceberg/dev/backports/parquet-row-group-selection-59.patch
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly-2026-04-16 --profile minimal --component rustfmt
      - name: Check Iceberg formatting
        working-directory: iceberg
        run: cargo +nightly-2026-04-16 fmt --all -- --check
      - name: Run live runtime and delete tests with local selections
        working-directory: iceberg
        run: |
          cargo +stable --config "patch.crates-io.parquet.path=\"$GITHUB_WORKSPACE/arrow/parquet\"" test -p iceberg --features runtime-row-group-selections --lib runtime_predicate -- --nocapture
      - name: Run existing reader regressions with local selections
        working-directory: iceberg
        run: |
          cargo +stable --config "patch.crates-io.parquet.path=\"$GITHUB_WORKSPACE/arrow/parquet\"" test -p iceberg --features runtime-row-group-selections --lib arrow::reader
      - name: Strict clippy for the selection-enabled reader
        working-directory: iceberg
        run: |
          cargo +stable --config "patch.crates-io.parquet.path=\"$GITHUB_WORKSPACE/arrow/parquet\"" clippy -p iceberg --features runtime-row-group-selections --tests -- -D warnings
      - name: Report the dependency difference
        if: always()
        working-directory: iceberg
        run: git diff -- Cargo.lock
